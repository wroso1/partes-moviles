<!DOCTYPE html>

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }
        .header {
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            padding: 20px 16px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #1f1f2e;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            font-size: 13px;
            color: #888;
            margin-top: 2px;
        }
        .header .wa-header-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #25D366;
            color: #000;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            margin-top: 10px;
        }
        .categories {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            background: #0a0a0f;
            position: sticky;
            top: 92px;
            z-index: 99;
            border-bottom: 1px solid #1a1a2e;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            flex-shrink: 0;
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid #2a2a3e;
            background: #12121a;
            color: #aaa;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .cat-btn.active {
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            color: #fff;
            border-color: transparent;
        }
        .products {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 16px;
            padding-bottom: 100px;
        }
        .product-card {
            background: #12121a;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #1f1f2e;
            transition: transform 0.2s;
        }
        .product-card:active {
            transform: scale(0.97);
        }
        .product-img {
            width: 100%;
            aspect-ratio: 1;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            position: relative;
        }
        .product-img .emoji-bg {
            font-size: 56px;
            filter: grayscale(0.3);
        }
        .product-img .badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #ff4757;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 8px;
        }
        .product-img .badge-hot {
            background: linear-gradient(135deg, #ff6b35, #ff4757);
        }
        .product-info {
            padding: 12px;
        }
        .product-info h3 {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-info .price {
            font-size: 18px;
            font-weight: 800;
            color: #00d4ff;
            margin: 4px 0;
        }
        .product-info .price span {
            font-size: 12px;
            color: #666;
            font-weight: 400;
            text-decoration: line-through;
            margin-left: 6px;
        }
        .product-info .desc {
            font-size: 12px;
            color: #888;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .product-info .wa-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: #25D366;
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
        }
        .product-info .wa-btn:active {
            background: #1da851;
        }
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10,10,15,0.95);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-top: 1px solid #1f1f2e;
            z-index: 100;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .bottom-bar .whatsapp-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            background: #25D366;
            color: #000;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
        }
        .bottom-bar .whatsapp-btn svg {
            width: 20px;
            height: 20px;
        }
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state .emoji {
            font-size: 48px;
            margin-bottom: 12px;
        }
        @media (min-width: 600px) {
            .products { grid-template-columns: repeat(3, 1fr); max-width: 900px; margin: 0 auto; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .product-card { animation: fadeIn 0.3s ease-out; }
    </style>
</head>

const WA_NUMBER = '573004515809';

function renderProducts(filter = 'all') {
    const container = document.getElementById('products');
    const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);
    
    if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="emoji">🔍</div><p>No hay productos en esta categoría</p></div>';
        return;
    }
    
    container.innerHTML = filtered.map(p => {
        const msg = encodeURIComponent(`Hola, quiero comprar: ${p.name} - $${p.price.toLocaleString('es-CO')}`);
        const waLink = `https://wa.me/${WA_NUMBER}?text=${msg}`;
        return `
            <div class="product-card">
                <div class="product-img">
                    <span class="emoji-bg">${p.emoji}</span>
                    ${p.badge ? `<span class="badge badge-hot">${p.badge}</span>` : ''}
                </div>
                <div class="product-info">
                    <h3>${p.name}</h3>
                    <div class="price">$${p.price.toLocaleString('es-CO')} <span>$${p.oldPrice.toLocaleString('es-CO')}</span></div>
                    <div class="desc">${p.desc}</div>
                    <a class="wa-btn" href="${waLink}" target="_blank">🛒 Comprar ahora</a>
                </div>
            </div>
        `;
    }).join('');
}

function filterProducts(category) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.cat-btn[onclick*="'${category}'"]`).classList.add('active');
    renderProducts(category);
}

renderProducts('all');
